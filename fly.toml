# Trivia Night — Fly.io config (update `app` name for your deployment)

app = 'trivia-night'
primary_region = 'ewr'

[build]

[env]
  DATA_DIR = '/app/data'
  NODE_ENV = 'production'
  PORT = '43128'
  # HOST_PASSCODE is required in production but must NOT go here.
  # Set it with: fly secrets set HOST_PASSCODE=choose-a-passcode

[[mounts]]
  source = 'trivia_data'
  destination = '/app/data'

[http_service]
  internal_port = 43128
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
